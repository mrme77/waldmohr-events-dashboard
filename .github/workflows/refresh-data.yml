name: Refresh Dashboard Data

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Verify dotenv installation
        run: |
          echo "Checking root dependencies..."
          npm ls dotenv
          echo "Checking module resolution..."
          node -e "console.log(import.meta.resolve('dotenv'))"
          echo "Checking from scripts directory..."
          cd scripts
          node -e "import('dotenv').then(() => console.log('dotenv imported successfully'))"
   
      - name: Refresh data
        working-directory: app
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run refresh 

      - name: Validate data
        working-directory: app
        run: npm run validate

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/public/*.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore(data): refresh dashboard datasets"
          git push
